<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Same black/white inversion the in-app <Logo> does, for the browser
         tab. This one can only follow the OS/browser theme, not the app's
         own light/dark toggle: a favicon is chosen by the browser from
         these media queries before any of our JS runs, so forcing dark
         inside the app while the OS is light leaves the tab on the light
         mark. Acceptable — the tab strip is drawn in the OS/browser theme
         anyway, so matching that is the correct target here. -->
    <link rel="icon" type="image/png" href="/favicon.png" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/png" href="/favicon-dark.png" media="(prefers-color-scheme: dark)" />
    <!-- Fallback for browsers that ignore media on <link rel=icon>. -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!-- viewport-fit=cover lets the app paint edge to edge on notched
         phones; every fixed bar below (the mobile top bar, the bottom tab
         bar, the sheet-style modal) pads itself back out of the unsafe
         area with env(safe-area-inset-*). maximum-scale is deliberately
         NOT set — pinch-zoom stays available. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Paints the phone's browser chrome (address bar / status bar) in
         the app's own background colour, so the page doesn't sit inside a
         differently-coloured frame. These two are the OS-preference
         fallback for the first paint; src/theme.jsx rewrites the tag to
         match the app's ACTUAL theme once React mounts, since the in-app
         toggle can disagree with the OS. -->
    <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <!-- Added to a phone's home screen, GymOS opens without browser
         chrome — the demo and the day-to-day desk both look like an app
         rather than a website. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="GymOS" />
    <!-- Makes the app installable: name, icons, the standalone display
         mode, and start_url — which is "/login", so launching the
         installed app opens the sign-in screen and never the marketing
         site. src/lib/standalone.js is the backstop for URLs that arrive
         some other way. -->
    <!-- Open the TCP+TLS handshakes to Firebase while the bundle is still
         downloading. Sign-in cannot start until the app has both the JS and
         a connection to these two hosts, and on a weak link the handshake is
         a meaningful slice of the wait — doing it in parallel with the
         download costs nothing and removes it from the critical path.
         Cross-origin, so crossorigin is required or the connection is opened
         and then thrown away unused. -->
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin />
    <link rel="dns-prefetch" href="https://firebasestorage.googleapis.com" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- iOS ignores the manifest's icons and reads only this. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>GymOS</title>
    <!-- Applies the theme BEFORE the app bundle loads. Without this, a
         machine whose OS is set to dark paints one dark frame: index.css's
         :root is light, but with no data-theme attribute yet the
         prefers-color-scheme block wins until React mounts and
         src/theme.jsx sets the attribute.

         Must stay in sync with src/theme.jsx — same "gymos-theme" key, and
         the same rule that anything other than a stored light/dark/system
         choice means LIGHT. "system" is the one value that deliberately
         sets no attribute, handing the decision back to the media query. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("gymos-theme");
          var theme = stored === "dark" || stored === "light" || stored === "system" ? stored : "light";
          if (theme !== "system") document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {
          // Private mode / storage blocked — fall through to the light default.
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
  </head>
  <body>
    <!-- A first paint that does NOT wait for the bundle.
         index.html arrives from the service worker's cache almost
         instantly, but the app inside it is ~750KB of JavaScript, so on a
         weak connection the screen stayed WHITE for as long as that took —
         and only then showed the app's own "Loading". The complaint was
         never really the loading screen, it was the blank wall in front of
         it.
         This is the same mark and wording the app's own <Splash> uses, in
         about 20 lines of inline markup, so the handover is invisible.
         React's createRoot().render() clears the container on its first
         commit, so there is nothing to tear down by hand. -->
    <style>
      #boot {
        min-height: 100vh;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 14px;
        font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      #boot img { width: 59px; height: auto; }
      #boot p { margin: 0; font-size: 14px; color: #6b7280; }
      /* Held back a beat: on a fast connection or a warm cache the app is up
         within a couple of hundred milliseconds, and flashing a splash for
         one frame looks worse than showing nothing at all. */
      #boot { animation: boot-in 0.2s ease-out 0.25s both; }
      @keyframes boot-in { from { opacity: 0 } to { opacity: 1 } }
      @media (prefers-color-scheme: dark) {
        :root[data-theme="dark"] #boot p, :root:not([data-theme="light"]) #boot p { color: #9ca3af; }
      }
    </style>
    <div id="root">
      <div id="boot">

             costs no request at all, so the very first paint needs nothing
             from the network or the disk; and it is the only form that works
             in BOTH builds — a root-absolute "/logo.png" is correct on the
             web but 404s under Electron's file:// load, which is exactly
             where this splash matters most. ~6KB of base64 in the HTML buys
             removing the last thing standing between the app opening and
             something appearing. -->
